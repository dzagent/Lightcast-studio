name: Build installers
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lightcast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: LightCast-${{ matrix.name }}
          path: |
            lightcast/release/*.exe
            lightcast/release/*.dmg
